<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared photos — PhotoSendr</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{--ink:#fff;--muted:rgba(255,255,255,.55);--canvas:#000;--surface:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--accent:#2b6acc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  header img{width:40px;height:40px;border-radius:10px}
  header .name{font-weight:600}
  header .sub{font-size:13px;color:var(--muted)}
  h1{font-size:26px;font-weight:600;margin:0 0 4px}
  .meta{color:var(--muted);font-size:14px;margin-bottom:26px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .grid a{display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);align-self:start}
  .grid img{width:100%;display:block}
  .grid .vid{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);
    display:flex;flex-direction:column}
  .vdl{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);
    color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;padding:11px 12px;cursor:pointer}
  .vdl[disabled]{opacity:.6;cursor:default}
  .grid video{width:100%;display:block}
  .state{padding:60px 0;text-align:center;color:var(--muted);font-size:17px}
  .state b{color:var(--ink)}
  .dl{display:inline-block;margin:0 0 22px;background:#fff;color:#000;font-weight:600;font-size:14px;
    padding:10px 18px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;
    font-family:inherit}
  .dl[disabled]{opacity:.6;cursor:default}
  footer{margin-top:48px;font-size:13px;color:var(--muted)}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="">
    <div><div class="name">PhotoSendr</div><div class="sub">Shared photos</div></div>
  </header>

  <div id="content"><div class="state">Loading photos…</div></div>

  <footer>
    Shared with <a href="index.html">PhotoSendr</a> — photos to your list, in a tap.
    Links expire automatically.
  </footer>
</div>

<script>
(function(){
  // CloudKit Web Services REST — tried in order. Release builds write to
  // Production; Debug builds write to Development.
  var CONTAINER = 'iCloud.com.fbmore.PhotoSendrV2';
  var ENVS = [
    { env: 'production',  token: '5e4c16bb43b9ec8f65903d02700e786d16892140d93643c6f2c8fff157c05c59' },
    { env: 'development', token: '4280390a9b9e3e0c65dfa221866d105ed6c249c84e7004cfc93080a1c3c0b783' }
  ].filter(function(e){ return e.token.indexOf('REPLACE') !== 0; });

  var content = document.getElementById('content');
  function state(html){ content.innerHTML = '<div class="state">'+html+'</div>'; }

  var recordName = (location.hash || '').replace(/^#/,'');
  if(!recordName){ state('This link is missing its photo id.'); return; }
  if(!ENVS.length){ state('Viewer not configured yet.'); return; }

  function lookup(i){
    if(i >= ENVS.length){
      state('<b>This link has expired</b><br>or the photos are no longer shared.');
      return;
    }
    var e = ENVS[i];
    fetch('https://api.apple-cloudkit.com/database/1/'+CONTAINER+'/'+e.env+'/public/records/lookup?ckAPIToken='+e.token, {
      method: 'POST',
      body: JSON.stringify({ records: [{ recordName: recordName }] })
    }).then(function(r){ return r.json(); }).then(function(resp){
      var rec = resp.records && resp.records[0];
      if(!rec || rec.serverErrorCode || !rec.fields){ lookup(i+1); return; }
      render(rec);
    }).catch(function(){ lookup(i+1); });
  }

  function render(rec){
    var f = rec.fields || {};
    var title = (f.title && f.title.value) || 'Shared photos';
    var expiresAt = f.expiresAt ? new Date(f.expiresAt.value) : null;
    if(expiresAt && expiresAt < new Date()){
      state('<b>This link has expired.</b>');
      return;
    }
    var items = (f.items && f.items.value) || [];
    var types = (f.itemTypes && f.itemTypes.value) || [];
    if(!items.length){ state('No photos in this share.'); return; }

    var photoEntries = [], videoEntries = [];
    var html = '<h1></h1><div class="meta"></div><div class="dlrow"></div><div class="grid">';
    items.forEach(function(it, i){
      var type = types[i] || 'photo';
      var isVideo = type === 'video';
      var name = (isVideo ? 'video-' : 'photo-')+(i+1)+(isVideo ? '.mp4' : '.jpg');
      var url = (it.downloadURL || (it.value && it.value.downloadURL) || '').replace('${f}', name);
      if(isVideo){
        // #t=0.001 makes Safari (and friends) paint the first frame as a
        // poster instead of leaving the tile black.
        html += '<div class="vid"><video controls playsinline preload="metadata" src="'+url+'#t=0.001"></video>'+
                '<button class="vdl" data-i="'+videoEntries.length+'">Download video</button></div>';
        videoEntries.push({ url: url, name: name });
      } else {
        photoEntries.push({ url: url, name: name });
        html += '<a href="'+url+'" download="'+name+'" target="_blank" rel="noopener">'+
                '<img src="'+url+'" alt="Photo '+(i+1)+'" loading="lazy"></a>';
      }
    });
    html += '</div>';
    content.innerHTML = html;
    content.querySelector('h1').textContent = title;
    if(photoEntries.length){
      var btn = document.createElement('button');
      btn.className = 'dl';
      btn.textContent = 'Download all photos ('+photoEntries.length+')';
      btn.addEventListener('click', function(){ downloadAll(photoEntries, title, btn); });
      content.querySelector('.dlrow').appendChild(btn);
    }
    Array.prototype.forEach.call(content.querySelectorAll('.vdl'), function(vbtn){
      vbtn.addEventListener('click', function(){
        downloadVideo(videoEntries[parseInt(vbtn.dataset.i, 10)], vbtn);
      });
    });
    var photos = types.length ? types.filter(function(t){return t!=='video';}).length : items.length;
    var vids = types.filter(function(t){return t==='video';}).length;
    var parts = [];
    if(photos) parts.push(photos+' photo'+(photos===1?'':'s'));
    if(vids) parts.push(vids+' video'+(vids===1?'':'s'));
    if(expiresAt) parts.push('link expires '+expiresAt.toLocaleDateString());
    content.querySelector('.meta').textContent = parts.join(' \u00b7 ');
    // Count the view (anonymous: stores only link-id -> integer)
    try { fetch('https://photosendr-views.fbmore.workers.dev/hit/'+encodeURIComponent(recordName)); } catch(err) {}
  }

  // --- Download-all: fetch every photo (videos excluded) and pack them
  // into one uncompressed ZIP, built right here — no libraries. JPEGs are
  // already compressed, so "store" entries lose nothing.

  var CRC_TABLE = (function(){
    var t = [], c, n, k;
    for(n = 0; n < 256; n++){
      c = n;
      for(k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8){
    var c = 0xFFFFFFFF;
    for(var i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function makeZip(files){
    var enc = new TextEncoder();
    var parts = [], central = [], offset = 0;
    var now = new Date();
    var dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    var dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    files.forEach(function(fl){
      var nameB = enc.encode(fl.name), data = fl.data, crc = crc32(data);
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true);
      lh.setUint16(26, nameB.length, true);
      parts.push(lh.buffer, nameB, data);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true);
      ch.setUint32(24, data.length, true);
      ch.setUint16(28, nameB.length, true);
      ch.setUint32(42, offset, true);
      central.push(ch.buffer, nameB);
      offset += 30 + nameB.length + data.length;
    });
    var centralSize = 0;
    central.forEach(function(b){ centralSize += b.byteLength; });
    var eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, files.length, true);
    eocd.setUint16(10, files.length, true);
    eocd.setUint32(12, centralSize, true);
    eocd.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [eocd.buffer]), { type: 'application/zip' });
  }

  // Apple's asset CDN sends no CORS headers, so a direct fetch is blocked
  // by the browser. Fall back to our view-counter worker, which proxies
  // Apple asset hosts only (GET, never cached).
  var ASSET_PROXY = 'https://photosendr-views.fbmore.workers.dev/asset?url=';
  function fetchAsset(u){
    return fetch(u).then(function(r){
      if(!r.ok) throw new Error('direct fetch failed');
      return r.arrayBuffer();
    }).catch(function(){
      return fetch(ASSET_PROXY + encodeURIComponent(u)).then(function(r){
        if(!r.ok) throw new Error('proxy fetch failed');
        return r.arrayBuffer();
      });
    });
  }

  // One video, saved as a file. The download attribute is ignored on
  // cross-origin links, so fetch (direct, then proxy) into a blob first.
  function downloadVideo(entry, btn){
    if(!entry || btn.disabled) return;
    btn.disabled = true;
    var orig = 'Download video';
    btn.textContent = 'Downloading…';
    fetchAsset(entry.url).then(function(buf){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], { type: 'video/mp4' }));
      a.download = entry.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 10000);
      btn.textContent = orig;
      btn.disabled = false;
    }).catch(function(){
      btn.textContent = 'Couldn’t download — tap to retry';
      btn.disabled = false;
    });
  }

  function downloadAll(entries, title, btn){
    if(btn.disabled) return;
    btn.disabled = true;
    var orig = btn.textContent, files = [], done = 0;
    btn.textContent = 'Preparing… 0/'+entries.length;
    Promise.all(entries.map(function(e, i){
      return fetchAsset(e.url).then(function(buf){
        files[i] = { name: e.name, data: new Uint8Array(buf) };
        done++;
        btn.textContent = 'Preparing… '+done+'/'+entries.length;
      });
    })).then(function(){
      var slug = title.replace(/[^\w\- ]/g, '').trim().replace(/\s+/g, '-').toLowerCase();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(makeZip(files));
      a.download = (slug || 'photosendr-photos') + '.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 10000);
      btn.textContent = orig;
      btn.disabled = false;
    }).catch(function(){
      btn.textContent = 'Couldn’t prepare the zip — tap photos to save them one by one';
      btn.disabled = false;
    });
  }

  lookup(0);
})();
</script>
</body>
</html>
