<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shared via PhotoSendr</title>
<meta name="robots" content="noindex">
<!-- Static fallback for link previews. Per-share og (title + cover) is
     served by the /v/<id> worker route; this covers direct view.html links,
     whose #hash never reaches any server. -->
<meta property="og:title" content="Shared photos — PhotoSendr">
<meta property="og:description" content="Photos shared with PhotoSendr — the link expires on its own.">
<meta property="og:image" content="https://photosendr.com/logo.png">
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{--ink:#fff;--muted:rgba(255,255,255,.55);--canvas:#000;--surface:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--accent:#2b6acc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px}
  header{display:flex;align-items:center;margin-bottom:22px}
  header .brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
  header img{width:28px;height:28px;border-radius:7px}
  header .name{font-weight:600;font-size:16px}
  h1{font-size:26px;font-weight:600;margin:0 0 4px}
  .meta{color:var(--muted);font-size:14px;margin-bottom:26px}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .grid a{display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);align-self:start}
  .grid img{width:100%;display:block}
  .grid .vid{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);
    display:flex;flex-direction:column;align-self:start}
  .grid .pdfwrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);
    display:flex;flex-direction:column;align-self:start}
  .grid .pdfwrap .tile{border:0;border-radius:0}
  .pdfthumb{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:rgba(255,255,255,.04)}
  .pdfthumb img{width:100%;height:100%;object-fit:contain;display:block}
  .pdfthumb .pdficon{font-size:44px;line-height:1}
  .pdfname{display:block;font-weight:600;font-size:14px;padding:10px 12px;text-align:center}
  .notice{display:flex;align-items:flex-start;gap:12px;margin:0 0 22px;padding:12px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface);font-size:14px;line-height:1.45}
  .notice[hidden]{display:none}
  .notice p{margin:0;flex:1}
  .notice .nclose{background:none;border:0;color:var(--muted);font:inherit;font-size:20px;line-height:1;
    cursor:pointer;padding:0 2px;min-width:32px;min-height:32px}
  .notice .nclose:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:8px}
  .vdl{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);
    color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;padding:11px 12px;cursor:pointer}
  .vdl[disabled]{opacity:.6;cursor:default}
  .grid video{width:100%;display:block}
  /* Tiles are buttons: they open the viewer, not a new tab. */
  .tile{display:block;width:100%;padding:0;margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:var(--surface);cursor:pointer;font:inherit;color:inherit;position:relative;align-self:start;
    -webkit-appearance:none;appearance:none;text-align:inherit}
  .tile:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .tile img,.tile video{width:100%;display:block;pointer-events:none}
  .tile .badge{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;
    padding:4px 11px;font-size:13px;line-height:1.2}
  .grid .vid .tile{border:0;border-radius:0}
  .state{padding:60px 0;text-align:center;color:var(--muted);font-size:17px}
  .state b{color:var(--ink)}
  .dlrow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
  .dlrow:empty{display:none}
  .dl{display:inline-block;margin:0;background:#fff;color:#000;font-weight:600;font-size:14px;
    padding:10px 18px;border-radius:12px;text-decoration:none;border:1px solid transparent;cursor:pointer;
    font-family:inherit;min-height:44px}
  .dl.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .dl[disabled]{opacity:.6;cursor:default}
  .dl:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .lbbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:600;
    font-size:14px;padding:9px 14px;border-radius:12px;cursor:pointer;min-height:44px;text-decoration:none;
    -webkit-appearance:none;appearance:none;line-height:1.3}
  .lbbtn{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.14)}
  .ico{width:22px;height:22px;display:block}
  .lbnav .ico{width:30px;height:30px}
  .dl .ico{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:7px}
  .ico.spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lbbtn[disabled]{opacity:.6;cursor:default}
  .lbbtn:focus-visible,.lbnav:focus-visible,.vdl:focus-visible{outline:3px solid #fff;outline-offset:-3px}
  .lburl{font:inherit;font-size:13px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
    background:rgba(0,0,0,.6);color:var(--ink);width:100%;-webkit-user-select:text;user-select:text}
  footer{margin-top:48px;font-size:13px;color:var(--muted)}
  footer a{color:var(--muted)}
  footer .fnote{margin-top:10px;font-size:12px;color:var(--muted)}
  footer .fnote a{text-decoration:underline}

  /* ---- Viewer (lightbox + slideshow) ---- */
  html.lb-open{overflow:hidden}
  .lb{position:fixed;inset:0;height:100vh;height:100dvh;background:#000;z-index:1000;
    overscroll-behavior:contain;outline:0;-webkit-user-select:none;user-select:none}
  .lb[hidden]{display:none}
  .lbstage{position:absolute;inset:0;touch-action:manipulation}
  .lbimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;
    transition:opacity var(--fade,0ms) ease}
  .lbimg.on{opacity:1}
  .lbvideo{position:absolute;inset:0;width:100%;height:100%;background:#000}
  .lb.isvideo .lbvideo{bottom:calc(84px + env(safe-area-inset-bottom));height:auto}
  .lberr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:17px;padding:20px;text-align:center}
  .lbdoc{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    padding:calc(72px + env(safe-area-inset-top)) 12px calc(84px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:14px;outline:0}
  .lbdoc[hidden]{display:none}
  .lbdoc canvas{background:#fff;border-radius:6px;max-width:100%;box-shadow:0 2px 14px rgba(0,0,0,.7)}
  .lbdoc .lbmsg{color:var(--muted);font-size:17px;margin-top:30vh}
  .chrome{position:absolute;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;
    padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));
    transition:opacity .25s;z-index:2}
  .chrome.top{top:0;padding-top:max(12px,env(safe-area-inset-top));
    background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0))}
  .chrome.bottom{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom));justify-content:center;
    background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.7))}
  .lbcount{margin-right:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:4px}
  .lburl{flex-basis:100%}
  .lbnav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;border-radius:16px;
    background:rgba(0,0,0,.45);color:#fff;cursor:pointer;z-index:2;transition:opacity .25s;padding:0;
    display:flex;align-items:center;justify-content:center}
  .lbnav.prev{left:max(8px,env(safe-area-inset-left))}
  .lbnav.next{right:max(8px,env(safe-area-inset-right))}
  .lbint{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .lbint select{font:inherit;font-size:14px;font-weight:600;background:rgba(0,0,0,.45);color:var(--ink);
    border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:0 8px;min-height:44px;cursor:pointer}
  .lb.idle .chrome,.lb.idle .lbnav{opacity:0}
  .lb.idle{cursor:none}
  .lbprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15);z-index:3}
  .lbprog i{display:block;height:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
  .lbprog.run i{animation:lbprog var(--interval,5s) linear forwards}
  .lbprog[hidden]{display:none}
  @keyframes lbprog{to{transform:scaleX(1)}}
  @media (prefers-reduced-motion: reduce){
    .lbimg,.chrome,.lbnav{transition:none}
    .lbprog{display:none}
    .ico.spin{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="https://photosendr.com" aria-label="PhotoSendr home">
      <img src="logo.png" alt="">
      <span class="name">PhotoSendr</span>
    </a>
  </header>

  <div id="content"><div class="state">Loading photos…</div></div>

  <footer>
    Shared with <a href="index.html">PhotoSendr</a> — photos to your list, in a tap.
    Links expire automatically.
    <div class="fnote">
      Files in this share were uploaded by the person who sent you this link and are
      stored in Apple's iCloud (CloudKit) — PhotoSendr runs no servers of its own.
      <a id="reportLink" href="mailto:hello@photosendr.com?subject=Report%20a%20shared%20PhotoSendr%20link">Report this share</a>
    </div>
  </footer>
</div>

<!-- Viewer overlay: one photo/video at a time, slideshow, keyboard + touch. -->
<div id="lb" class="lb" role="dialog" aria-modal="true" aria-label="" hidden tabindex="-1">
  <div id="lbStage" class="lbstage">
    <img id="lbA" class="lbimg" alt="" decoding="async">
    <img id="lbB" class="lbimg" alt="" decoding="async">
    <video id="lbVideo" class="lbvideo" controls playsinline preload="metadata" hidden></video>
    <div id="lbDoc" class="lbdoc" hidden></div>
    <div id="lbErr" class="lberr" hidden></div>
  </div>
  <div class="chrome top">
    <span id="lbCount" class="lbcount" aria-hidden="true"></span>
    <button id="lbDl" class="lbbtn" type="button"></button>
    <button id="lbCopy" class="lbbtn" type="button"></button>
    <button id="lbFs" class="lbbtn" type="button" hidden aria-pressed="false"></button>
    <button id="lbClose" class="lbbtn" type="button"></button>
    <input id="lbUrl" class="lburl" type="text" readonly hidden>
  </div>
  <button id="lbPrev" class="lbnav prev" type="button"></button>
  <button id="lbNext" class="lbnav next" type="button"></button>
  <div class="chrome bottom">
    <button id="lbPlay" class="lbbtn" type="button" aria-pressed="false"></button>
    <label class="lbint" id="lbInt"><span id="lbIntLbl" class="vh"></span>
      <select id="lbInterval"><option value="3">3 s</option><option value="5" selected>5 s</option><option value="10">10 s</option></select>
    </label>
  </div>
  <div id="lbProg" class="lbprog" aria-hidden="true" hidden><i></i></div>
</div>
<div id="lbLive" class="vh" aria-live="polite" aria-atomic="true"></div>

<script>
(function(){
  // CloudKit Web Services REST — tried in order. Release builds write to
  // Production; Debug builds write to Development.
  var CONTAINER = 'iCloud.com.fbmore.PhotoSendrV2';
  var ENVS = [
    { env: 'production',  token: '5e4c16bb43b9ec8f65903d02700e786d16892140d93643c6f2c8fff157c05c59' },
    { env: 'development', token: '4280390a9b9e3e0c65dfa221866d105ed6c249c84e7004cfc93080a1c3c0b783' }
  ].filter(function(e){ return e.token.indexOf('REPLACE') !== 0; });

  // Viewer strings, gathered here so the localization pass can swap them.
  var STR = {
    viewer:'Photo viewer', close:'Close', prev:'Previous', next:'Next',
    photoOf:'Photo {n} of {total}', videoOf:'Video {n} of {total}', pdfOf:'PDF {n} of {total}, {pages} pages',
    pageOf:'Page {n} of {total}', pdfLoading:'Loading PDF…', pdfError:'Couldn’t display this PDF — use Download to save it',
    downloadPdf:'Download PDF', downloadAll:'Download all ({n})', downloadAllPhotos:'Download all photos ({n})',
    nPhotos1:'1 photo', nPhotosN:'{n} photos', nPdf1:'1 PDF', nPdfN:'{n} PDFs', and:' and ',
    zipHas:'The zip has {items}.', zipVideo1:'The video is too large to bundle — save it with the Download button under it.',
    zipVideoN:'The {n} videos are too large to bundle — save each one with the Download button under it.',
    dismiss:'Dismiss',
    play:'Play slideshow', pause:'Pause slideshow',
    fullscreen:'Enter fullscreen', exitFullscreen:'Exit fullscreen', download:'Download',
    interval:'Seconds per slide', loadError:'Couldn’t load this photo',
    slideshowStarted:'Slideshow playing', slideshowPaused:'Slideshow paused',
    slideshowBtn:'Slideshow', downloading:'Downloading…', downloadFailed:'Couldn’t download — tap to retry',
    copyLink:'Copy link', copied:'Link copied', copyFailed:'Copy the link below', copyLinkTo:'Copy link to this {kind}',
    linkField:'Link to this item', titleSuffix:' - shared via PhotoSendr'
  };
  function t(k, v){ return STR[k].replace(/\{(\w+)\}/g, function(_, n){ return v[n]; }); }

  // Minimal line icons (24-unit grid). Decorative: the button carries the label.
  var ICONS = {
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    prev: '<path d="M15 5l-7 7 7 7"/>',
    next: '<path d="M9 5l7 7-7 7"/>',
    play: '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
    pause: '<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    link: '<path d="M10 14a4 4 0 005.66 0l3-3a4 4 0 00-5.66-5.66L12 7.3"/><path d="M14 10a4 4 0 00-5.66 0l-3 3a4 4 0 005.66 5.66L12 16.7"/>',
    check: '<path d="M5 12l5 5L20 7"/>',
    expand: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    compress: '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',
    clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
    spinner: '<path d="M12 3a9 9 0 019 9"/>'
  };
  function icon(name, cls){
    return '<svg class="ico'+(cls ? ' '+cls : '')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+ICONS[name]+'</svg>';
  }
  // Icon buttons show a glyph and carry their words in aria-label + title;
  // text buttons just show the words.
  function setBtn(btn, text, iconName, cls){
    if(btn.classList.contains('lbbtn') || btn.classList.contains('lbnav')){
      btn.innerHTML = icon(iconName, cls);
      btn.setAttribute('aria-label', text);
      btn.title = text;
    } else {
      btn.textContent = text;
    }
  }

  var content = document.getElementById('content');
  function state(html){ content.innerHTML = '<div class="state">'+html+'</div>'; }

  // #<recordName>[/<itemNumber>] — the optional 1-based item number deep-links
  // to one photo/video/PDF (the /v/<id>?p=N form is rewritten to this).
  var hashParts = (location.hash || '').replace(/^#/,'').split('/');
  var recordName = hashParts[0];
  var deepIndex = parseInt(hashParts[1], 10);
  var DEMO = /[?&]demo(=|&|$)/.test(location.search);
  if(DEMO && !recordName) recordName = 'demo';
  function deepLink(recordIndex){ return 'https://photosendr.com/v/' + recordName + '?p=' + (recordIndex + 1); }

  // A reload while the viewer was open leaves its history entry behind.
  if(history.state && history.state.psLb){ try{ history.replaceState(null, '', location.href); }catch(e){} }

  // Pre-fill the report email with everything support needs to find and
  // delete the record.
  var reportLink = document.getElementById('reportLink');
  if(reportLink){
    reportLink.href = 'mailto:hello@photosendr.com'
      + '?subject=' + encodeURIComponent('Report a shared PhotoSendr link')
      + '&body=' + encodeURIComponent(
          'I would like to report this shared link:\n\n' + location.href +
          '\n\nRecord: ' + (recordName || 'unknown') +
          '\n\nReason: ');
  }

  if(!recordName){ state('This link is missing its photo id.'); return; }
  if(!ENVS.length && !DEMO){ state('Viewer not configured yet.'); return; }

  function lookup(i){
    if(i >= ENVS.length){
      state('<b>This link has expired</b><br>or the photos are no longer shared.');
      return;
    }
    var e = ENVS[i];
    fetch('https://api.apple-cloudkit.com/database/1/'+CONTAINER+'/'+e.env+'/public/records/lookup?ckAPIToken='+e.token, {
      method: 'POST',
      body: JSON.stringify({ records: [{ recordName: recordName }] })
    }).then(function(r){ return r.json(); }).then(function(resp){
      var rec = resp.records && resp.records[0];
      if(!rec || rec.serverErrorCode || !rec.fields){ lookup(i+1); return; }
      render(rec);
    }).catch(function(){ lookup(i+1); });
  }

  function render(rec){
    var f = rec.fields || {};
    var title = (f.title && f.title.value) || 'Shared photos';
    var expiresAt = f.expiresAt ? new Date(f.expiresAt.value) : null;
    if(expiresAt && expiresAt < new Date()){
      state('<b>This link has expired.</b>');
      return;
    }
    var items = (f.items && f.items.value) || [];
    var types = (f.itemTypes && f.itemTypes.value) || [];
    if(!items.length){ state('No photos in this share.'); return; }

    var photoEntries = [], videoEntries = [], pdfEntries = [], viewables = [];
    var html = '<h1></h1><div class="meta"></div><div class="dlrow"></div><div class="grid">';
    items.forEach(function(it, i){
      var type = types[i] || 'photo';
      var isVideo = type === 'video';
      var isPdf = type === 'pdf';
      var name = isPdf ? (title.replace(/[^\w\- ]+/g,'').trim() || 'document')+(pdfEntries.length ? '-'+(pdfEntries.length+1) : '')+'.pdf'
                       : (isVideo ? 'video-' : 'photo-')+(i+1)+(isVideo ? '.mp4' : '.jpg');
      var url = (it.downloadURL || (it.value && it.value.downloadURL) || '').replace('${f}', encodeURIComponent(name));
      if(isPdf){
        // First page is rendered in as a thumbnail once pdf.js has loaded.
        html += '<div class="pdfwrap" id="item-'+i+'">'+
                '<button type="button" class="tile" data-v="'+viewables.length+'" aria-haspopup="dialog" aria-label="PDF '+(i+1)+'">'+
                '<span class="pdfthumb"><span class="pdficon" aria-hidden="true">📄</span></span>'+
                '<span class="pdfname"></span></button>'+
                '<button class="vdl pdfdl" data-p="'+pdfEntries.length+'"></button></div>';
        pdfEntries.push({ url: url, name: name });
        viewables.push({ url: url, type: 'pdf', name: name, index: i });
      } else if(isVideo){
        // #t=0.001 makes Safari (and friends) paint the first frame as a
        // poster instead of leaving the tile black. The tile opens the
        // viewer, where the video plays with native controls.
        html += '<div class="vid"><button type="button" class="tile" data-v="'+viewables.length+'" aria-haspopup="dialog" aria-label="Video '+(i+1)+'">'+
                '<video muted playsinline preload="metadata" tabindex="-1" aria-hidden="true" src="'+url+'#t=0.001"></video>'+
                '<span class="badge" aria-hidden="true">▶</span></button>'+
                '<button class="vdl" data-i="'+videoEntries.length+'">Download video</button></div>';
        videoEntries.push({ url: url, name: name });
        viewables.push({ url: url, type: 'video', name: name, index: i });
      } else {
        photoEntries.push({ url: url, name: name });
        viewables.push({ url: url, type: 'photo', name: name, index: i });
        html += '<button type="button" class="tile" data-v="'+(viewables.length-1)+'" aria-haspopup="dialog">'+
                '<img src="'+url+'" alt="Photo '+(i+1)+'" loading="lazy"></button>';
      }
    });
    html += '</div>';
    content.innerHTML = html;
    document.title = title + STR.titleSuffix;
    content.querySelector('h1').textContent = title;
    Array.prototype.forEach.call(content.querySelectorAll('.pdfname'), function(el){
      el.textContent = title + ' (PDF)';
    });
    Array.prototype.forEach.call(content.querySelectorAll('.pdfdl'), function(el){
      el.textContent = STR.downloadPdf;
      el.addEventListener('click', function(){
        downloadOne(pdfEntries[parseInt(el.dataset.p, 10)], el, 'application/pdf', STR.downloadPdf);
      });
    });
    // Actions row: Slideshow leads, Download all follows.
    var dlrow = content.querySelector('.dlrow');
    var hasShow = viewables.length >= 2;
    if(hasShow){
      var sbtn = document.createElement('button');
      sbtn.className = 'dl';
      sbtn.innerHTML = icon('play') + '<span></span>';
      sbtn.querySelector('span').textContent = STR.slideshowBtn;
      sbtn.setAttribute('aria-label', STR.play);
      sbtn.addEventListener('click', function(){ openAt(0, { play: true }); });
      dlrow.appendChild(sbtn);
    }
    // The zip takes photos and PDFs; videos are too large to bundle in RAM,
    // so a notice points at their own Download buttons.
    var zipEntries = photoEntries.concat(pdfEntries);
    if(zipEntries.length){
      var btn = document.createElement('button');
      btn.className = hasShow ? 'dl ghost' : 'dl';
      btn.textContent = pdfEntries.length ? t('downloadAll', { n: zipEntries.length })
                                          : t('downloadAllPhotos', { n: zipEntries.length });
      btn.addEventListener('click', function(){
        if(videoEntries.length) showZipNotice(photoEntries.length, pdfEntries.length, videoEntries.length);
        downloadAll(zipEntries, title, btn);
      });
      dlrow.appendChild(btn);
      var notice = document.createElement('div');

  // ---- PDF rendering (pdf.js, loaded only when a share has a PDF) ----
  // Bytes come through fetchAsset (direct, then proxy) because Apple's CDN
  // sends no CORS headers for pdf.js to read them itself.
  var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var pdfLibPromise = null, pdfDocs = {};
  function loadPdfLib(){
    if(pdfLibPromise) return pdfLibPromise;
    pdfLibPromise = new Promise(function(res, rej){
      if(window.pdfjsLib){ res(window.pdfjsLib); return; }
      var sc = document.createElement('script');
      sc.src = PDFJS_URL; sc.async = true;
      sc.onload = function(){
        if(!window.pdfjsLib){ rej(new Error('pdfjs missing')); return; }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        res(window.pdfjsLib);

      sc.onerror = function(){ pdfLibPromise = null; rej(new Error('pdfjs failed to load')); };
      document.head.appendChild(sc);
    });

  function loadPdfDoc(url){
    if(pdfDocs[url]) return pdfDocs[url];
    pdfDocs[url] = Promise.all([loadPdfLib(), fetchAsset(url)]).then(function(r){
      return r[0].getDocument({ data: r[1] }).promise;
    });
    pdfDocs[url].catch(function(){ delete pdfDocs[url]; });
    return pdfDocs[url];

  function renderPdfPage(doc, pageNum, cssWidth, canvas){
    if(canvas._rendered) return Promise.resolve();
    canvas._rendered = true;
    return doc.getPage(pageNum).then(function(page){
      var base = page.getViewport({ scale: 1 });
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var vp = page.getViewport({ scale: (cssWidth / base.width) * dpr });
      canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
      canvas.style.width = cssWidth + 'px';
      canvas.style.height = Math.floor(vp.height / dpr) + 'px';
      return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    });
  }
  // Grid: swap each PDF tile's icon for its first page, one at a time.
  function renderPdfThumbs(){
    var pdfs = S.viewables.filter(function(v){ return v.type === 'pdf'; });
    (function next(i){
      if(i >= pdfs.length) return;
      var v = pdfs[i], holder = v.tile && v.tile.querySelector('.pdfthumb');
      if(!holder){ next(i + 1); return; }

        var c = document.createElement('canvas');
        return renderPdfPage(doc, 1, Math.min(holder.clientWidth || 400, 600), c).then(function(){
          var im = document.createElement('img');

          holder.innerHTML = ''; holder.appendChild(im);
        });

    })(0);

  // ---- Input ----

  function onKey(e){

    kickIdle();
    if(inField) return;
    if(inVideo && (e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;

  function trapTab(e){

  }

  function requestWakeLock(){
    if(!('wakeLock' in navigator) || !S.playing || document.hidden || S.wakeLock) return;
    try {
      navigator.wakeLock.request('screen').then(function(l){
        S.wakeLock = l;
        l.addEventListener('release', function(){ S.wakeLock = null; });
      }).catch(function(){});
    } catch(e) {}
  }
  function releaseWakeLock(){
    if(!S.wakeLock) return;
    try { S.wakeLock.release().catch(function(){}); } catch(e) {}
    S.wakeLock = null;
  }

  function onVisibility(){
    if(!S.open) return;
    if(document.hidden){
      if(S.playing){ S.resumeOnVisible = true; stopShow(true); }
    } else if(S.resumeOnVisible){
      S.resumeOnVisible = false;
      startShow();
    }
  }

  // ---- Per-item actions ----

  function downloadCurrent(){
    var it = S.viewables[S.cur];
    if(!it) return;
    downloadOne(it, lbDl, it.type === 'video' ? 'video/mp4' : (it.type === 'pdf' ? 'application/pdf' : 'image/jpeg'), STR.download);
  }

  function copyLink(recordIndex, btn, fallbackInput){
    var url = deepLink(recordIndex);
    var idle = btn.getAttribute('aria-label') || STR.copyLink;
    function ok(){
      setBtn(btn, STR.copied, 'check');
      announce(STR.copied);
      clearTimeout(btn._copyTimer);
      btn._copyTimer = setTimeout(function(){ setBtn(btn, idle, 'link'); }, 2000);
    }
    function fail(){
      setBtn(btn, idle, 'link');
      if(!fallbackInput) return;
      fallbackInput.value = url;
      fallbackInput.hidden = false;
      fallbackInput.focus();
      fallbackInput.select();
      announce(STR.copyFailed);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(ok, fail);
    } else fail();
  }

  // --- Download-all: fetch every photo (videos excluded) and pack them
  // into one uncompressed ZIP, built right here — no libraries. JPEGs are
  // already compressed, so "store" entries lose nothing.

  var CRC_TABLE = (function(){
    var t = [], c, n, k;
    for(n = 0; n < 256; n++){
      c = n;
      for(k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8){
    var c = 0xFFFFFFFF;
    for(var i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function makeZip(files){
    var enc = new TextEncoder();
    var parts = [], central = [], offset = 0;
    var now = new Date();
    var dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    var dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    files.forEach(function(fl){
      var nameB = enc.encode(fl.name), data = fl.data, crc = crc32(data);
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true);
      lh.setUint16(26, nameB.length, true);
      parts.push(lh.buffer, nameB, data);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true);
      ch.setUint32(24, data.length, true);
      ch.setUint16(28, nameB.length, true);
      ch.setUint32(42, offset, true);
      central.push(ch.buffer, nameB);
      offset += 30 + nameB.length + data.length;
    });
    var centralSize = 0;
    central.forEach(function(b){ centralSize += b.byteLength; });
    var eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, files.length, true);
    eocd.setUint16(10, files.length, true);
    eocd.setUint32(12, centralSize, true);
    eocd.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [eocd.buffer]), { type: 'application/zip' });
  }

  // Apple's asset CDN sends no CORS headers, so a direct fetch is blocked
  // by the browser. Fall back to our view-counter worker, which proxies
  // Apple asset hosts only (GET, never cached).
  var ASSET_PROXY = 'https://photosendr-views.fbmore.workers.dev/asset?url=';
  function fetchAsset(u){
    return fetch(u).then(function(r){
      if(!r.ok) throw new Error('direct fetch failed');
      return r.arrayBuffer();
    }).catch(function(){
      return fetch(ASSET_PROXY + encodeURIComponent(u)).then(function(r){
        if(!r.ok) throw new Error('proxy fetch failed');
        return r.arrayBuffer();
      });
    });
  }

  function saveBlob(blob, name){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 10000);
  }

  // One item, saved as a file. The download attribute is ignored on
  // cross-origin links, so fetch (direct, then proxy) into a blob first.
  function downloadOne(entry, btn, mime, idleLabel){
    if(!entry || btn.disabled) return;
    btn.disabled = true;
    setBtn(btn, STR.downloading, 'spinner', 'spin');
    fetchAsset(entry.url).then(function(buf){
      saveBlob(new Blob([buf], { type: mime }), entry.name);
      setBtn(btn, idleLabel, 'download');
      btn.disabled = false;
    }).catch(function(){
      setBtn(btn, STR.downloadFailed, 'alert');
      btn.disabled = false;
    });
  }
  function downloadVideo(entry, btn){ downloadOne(entry, btn, 'video/mp4', 'Download video'); }

  function downloadAll(entries, title, btn){
    if(btn.disabled) return;
    btn.disabled = true;
    var orig = btn.textContent, files = [], done = 0;
    btn.textContent = 'Preparing… 0/'+entries.length;
    Promise.all(entries.map(function(e, i){
      return fetchAsset(e.url).then(function(buf){
        files[i] = { name: e.name, data: new Uint8Array(buf) };
        done++;
        btn.textContent = 'Preparing… '+done+'/'+entries.length;
      });
    })).then(function(){
      var slug = title.replace(/[^\w\- ]/g, '').trim().replace(/\s+/g, '-').toLowerCase();
      saveBlob(makeZip(files), (slug || 'photosendr-photos') + '.zip');
      btn.textContent = orig;
      btn.disabled = false;
    }).catch(function(){
      btn.textContent = 'Couldn’t prepare the zip — tap photos to save them one by one';
      btn.disabled = false;
    });
  }

  // A tiny valid two-page PDF, built by hand (xref included).
  function demoPdfDataUrl(){
    var objs = [
      '<< /Type /Catalog /Pages 2 0 R >>',
      '<< /Type /Pages /Kids [3 0 R 5 0 R] /Count 2 >>',
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 7 0 R >> >> >>',
      null, // stream 1
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 6 0 R /Resources << /Font << /F1 7 0 R >> >> >>',
      null, // stream 2
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'
    ];
    function stream(txt){ var c = 'BT /F1 40 Tf 60 700 Td (' + txt + ') Tj ET'; return '<< /Length ' + c.length + ' >>\nstream\n' + c + '\nendstream'; }
    objs[3] = stream('Demo PDF - page 1'); objs[5] = stream('Demo PDF - page 2');
    var out = '%PDF-1.4\n', offsets = [];
    objs.forEach(function(o, k){ offsets.push(out.length); out += (k + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
    var xref = out.length;
    out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
    offsets.forEach(function(o){ out += ('0000000000' + o).slice(-10) + ' 00000 n \n'; });
    out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
    return 'data:application/pdf;base64,' + btoa(out);
  }

  // ?demo — offline stand-in record (the CloudKit tokens are origin-locked,
  // so localhost can never look a real share up).
  function renderDemo(){
    var items = [], types = [];
    items.push({ downloadURL: demoPdfDataUrl() }); types.push('pdf');
    ['#2b6acc','#c0392b','#27ae60','#8e44ad','#e67e22','#16a085'].forEach(function(c, i){
      var cv = document.createElement('canvas');
      cv.width = 1600; cv.height = i % 2 ? 1000 : 1200;
      var g = cv.getContext('2d');
      g.fillStyle = c; g.fillRect(0, 0, cv.width, cv.height);
      g.fillStyle = '#fff'; g.font = 'bold 260px sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(i + 2), cv.width / 2, cv.height / 2);
      items.push({ downloadURL: cv.toDataURL('image/jpeg', 0.8) }); types.push('photo');
    });
    items.push({ downloadURL: 'media/pitch-hero.mp4' }); types.push('video');
    render({ fields: { title: { value: 'Demo share' }, expiresAt: { value: Date.now() + 5 * 86400000 },
                       items: { value: items }, itemTypes: { value: types } } });
  }

  if(DEMO){ window.__psViewer = { S: S, startShow: startShow, stopShow: stopShow, show: show }; renderDemo(); }
  else lookup(0);
})();
</script>
